services:
  vertex-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: chang-store-vertex-gateway:local
    container_name: chang-store-vertex-gateway
    restart: unless-stopped
    env_file:
      - ./gateway/.env
    ports:
      - "${GATEWAY_HOST_PORT:-19089}:8080"
    environment:
      GATEWAY_CONFIG_FILE: /app/config.yaml
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
      - "/media/monet/SSD Web/CodeBase:/run/vertex-accounts:ro"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
