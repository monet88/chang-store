# Chang Store Workflow Add Or Migrate Backend Feature With Job Pipeline

## Action

Follow the add-or-migrate-backend-feature-with-job-pipeline workflow:
1. Create or update API route files under api/jobs/ (e.g., [id].ts, results.ts, index.ts)
2. Add or update workflow runner logic (e.g., workflows/feature-runner.ts, workflows/helpers.ts, server/workflows/job-runner.ts)
3. Update or add database migration files for new tables or fields (e.g., migrations/002_job_tables.sql)
4. Update server adapters or executors (e.g., server/adapters/*.ts, server/gemini.ts)
5. Integrate with frontend service and hooks (e.g., src/services/jobService.ts, src/hooks/useJobPoll.ts, src/hooks/useFeature.ts)
6. Update or add frontend components for job status/history (e.g., src/components/JobStatusBadge.tsx, src/components/JobHistoryView.tsx)
7. Write or update tests for new/migrated features (e.g., __tests__/hooks/useFeature.test.tsx, __tests__/services/jobRunner.test.ts)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: api/jobs/[id].ts, api/jobs/results.ts, api/jobs/index.ts

